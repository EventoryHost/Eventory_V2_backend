name: Deploy Upload Service

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - "upload-service/**"
      - ".github/workflows/deploy-upload-service.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy upload-service to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Select target
        id: target
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BRANCH="${ENVIRONMENT}"
          fi

          if [ "${BRANCH}" = "dev" ]; then
            echo "app_name=upload-dev" >> "$GITHUB_OUTPUT"
            echo "app_dir=/home/ubuntu/upload-dev" >> "$GITHUB_OUTPUT"
            echo "port=5100" >> "$GITHUB_OUTPUT"
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          elif [ "${BRANCH}" = "prod" ]; then
            echo "app_name=upload-prod" >> "$GITHUB_OUTPUT"
            echo "app_dir=/home/ubuntu/upload-prod" >> "$GITHUB_OUTPUT"
            echo "port=6100" >> "$GITHUB_OUTPUT"
            echo "branch=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${BRANCH}"
            exit 1
          fi

      - name: Install SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy & sync .env
        shell: bash
        env:
          UPLOAD_DEV_ENV: ${{ secrets.UPLOAD_DEV_ENV }}
          UPLOAD_PROD_ENV: ${{ secrets.UPLOAD_PROD_ENV }}
        run: |
          BRANCH="${{ steps.target.outputs.branch }}"
          APP_NAME="${{ steps.target.outputs.app_name }}"
          APP_DIR="${{ steps.target.outputs.app_dir }}"
          PORT="${{ steps.target.outputs.port }}"

          if [ "$BRANCH" = "prod" ]; then
            RAW_ENV="$UPLOAD_PROD_ENV"
          else
            RAW_ENV="$UPLOAD_DEV_ENV"
          fi

          B64_ENV=$(printf '%s' "$RAW_ENV" | base64 -w 0)

          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_NAME='$APP_NAME' \
             APP_DIR='$APP_DIR' \
             PORT='$PORT' \
             BRANCH='$BRANCH' \
             B64_ENV='$B64_ENV'" bash -s << 'EOF'
            set -e

            REPO_URL="https://github.com/EventoryHost/Eventory_V2_backend.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            cd upload-service
            npm ci --omit=dev

            if [ -n "$B64_ENV" ]; then
              echo "$B64_ENV" | base64 -d > .env
              echo "Synced .env from GitHub Secrets."
            elif [ ! -f ".env" ]; then
              echo "Error: Missing $APP_DIR/upload-service/.env on server and no GitHub Secret found"
              exit 1
            fi

            sed -i "/^PORT=/d" .env 2>/dev/null || true
            printf '\nPORT=%s\n' "$PORT" >> .env

            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            pm2 start server.js --name "$APP_NAME" --cwd "$APP_DIR/upload-service" --update-env
            pm2 save

            sleep 3
            curl -fsS "http://localhost:$PORT/health/ready" || { pm2 logs "$APP_NAME" --lines 50 --nostream; exit 1; }
          EOF
