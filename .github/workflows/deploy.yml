name: Deploy V2 Backend

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Select target
        id: target
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            BRANCH="${ENVIRONMENT}"
          fi

          if [ "${BRANCH}" = "dev" ]; then
            echo "app_name=v2-dev" >> "$GITHUB_OUTPUT"
            echo "app_dir=/home/ubuntu/v2-dev" >> "$GITHUB_OUTPUT"
            echo "port=5000" >> "$GITHUB_OUTPUT"
            echo "node_env=development" >> "$GITHUB_OUTPUT"
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          elif [ "${BRANCH}" = "prod" ]; then
            echo "app_name=v2-prod" >> "$GITHUB_OUTPUT"
            echo "app_dir=/home/ubuntu/v2-prod" >> "$GITHUB_OUTPUT"
            echo "port=6000" >> "$GITHUB_OUTPUT"
            echo "node_env=production" >> "$GITHUB_OUTPUT"
            echo "branch=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${BRANCH}"
            exit 1
          fi

      - name: Install SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy & Auto-Sync .env
        shell: bash
        env:
          V2_DEV_ENV: ${{ secrets.V2_DEV_ENV }}
          V2_PROD_ENV: ${{ secrets.V2_PROD_ENV }}
        run: |
          BRANCH="${{ steps.target.outputs.branch }}"
          APP_NAME="${{ steps.target.outputs.app_name }}"
          APP_DIR="${{ steps.target.outputs.app_dir }}"
          PORT="${{ steps.target.outputs.port }}"
          NODE_ENV="${{ steps.target.outputs.node_env }}"

          # Pick the environment secret based on the deployment target
          if [ "$BRANCH" = "prod" ]; then
            RAW_ENV="$V2_PROD_ENV"
          else
            RAW_ENV="$V2_DEV_ENV"
          fi

          # Base64 encode to safely transmit special chars and RSA keys over SSH
          B64_ENV=$(printf '%s' "$RAW_ENV" | base64 -w 0)

          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_NAME='$APP_NAME' \
             APP_DIR='$APP_DIR' \
             PORT='$PORT' \
             NODE_ENV='$NODE_ENV' \
             BRANCH='$BRANCH' \
             B64_ENV='$B64_ENV'" bash -s << 'EOF'
            set -e

            REPO_URL="https://github.com/EventoryHost/Eventory_V2_backend.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm ci

            # Write .env from GitHub Secret if provided
            if [ -n "$B64_ENV" ]; then
              echo "$B64_ENV" | base64 -d > .env
              echo "Synced .env from GitHub Secrets."
            elif [ ! -f ".env" ]; then
              echo "Error: Missing $APP_DIR/.env on server and no GitHub Secret found"
              exit 1
            fi

            # Guarantee PORT and NODE_ENV match deployment target
            sed -i "/^PORT=/d" .env 2>/dev/null || true
            printf '\nPORT=%s\n' "$PORT" >> .env
            sed -i "/^NODE_ENV=/d" .env 2>/dev/null || true
            printf 'NODE_ENV=%s\n' "$NODE_ENV" >> .env

            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            pm2 start server.js --name "$APP_NAME" --update-env

            pm2 save
            pm2 status "$APP_NAME"
          EOF
